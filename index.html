<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const theme =
          localStorage.getItem('inker-theme') ??
          localStorage.getItem('markleaf-theme');
        const builtInThemes = [
          'paper',
          'white',
          'dark',
          'vscode-light',
          'vscode-dark',
          'vscode-hc',
        ];
        let appliedTheme = theme;
        if (theme && !builtInThemes.includes(theme)) {
          try {
            const customThemes = JSON.parse(
              localStorage.getItem('inker-custom-ui-themes') ?? '[]',
            );
            const custom = Array.isArray(customThemes)
              ? customThemes.find((item) => item?.id === theme)
              : null;
            if (custom && builtInThemes.includes(custom.base)) {
              appliedTheme = custom.base;
              document.documentElement.dataset.customTheme = theme;
            }
          } catch {
            // Fall back to the default theme.
          }
        }
        if (builtInThemes.includes(appliedTheme)) {
          document.documentElement.dataset.theme = appliedTheme;
        }
        const font =
          localStorage.getItem('inker-font-family') ??
          localStorage.getItem('markleaf-font-family');
        if (
          ['jetbrains-mono', 'fira-code', 'source-code-pro', 'system-mono'].includes(
            font,
          )
        ) {
          document.documentElement.dataset.font = font;
        }
        const rawFontSize =
          localStorage.getItem('inker-font-size') ??
          localStorage.getItem('markleaf-font-size');
        const fontSize = Number(rawFontSize);
        if (Number.isFinite(fontSize) && fontSize >= 11 && fontSize <= 28) {
          document.documentElement.style.setProperty(
            '--content-font-size',
            `${fontSize}px`,
          );
        }
      } catch {
        // Ignore storage errors and use the defaults.
      }
    </script>
    <title>Inker</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
