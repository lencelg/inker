[package]
name = "inker"
version = "0.1.2"
description = "Inker - local Markdown editor"
authors = ["lencelg"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "inker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
base64 = "0.22"
notify = "8.2"

[dev-dependencies]
tempfile = "3"
