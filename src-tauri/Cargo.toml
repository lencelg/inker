[package]
name = "markdown-notes-tauri"
version = "0.1.0"
description = "Local-first Markdown notes"
authors = ["lencelg"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "markdown_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
trash = "5"

[dev-dependencies]
tempfile = "3"
